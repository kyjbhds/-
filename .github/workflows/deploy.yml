name: Deploy to Aliyun OSS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: cd web && npm install
        
      - name: Build
        run: cd web && npm run build
        
      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64
          chmod 755 ossutil64
          sudo mv ossutil64 /usr/local/bin/ossutil
          
      - name: Configure Aliyun OSS
        run: |
          ossutil config -e oss-cn-hangzhou.aliyuncs.com -i ${{ secrets.ALIYUN_ACCESS_KEY_ID }} -k ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          
      - name: Deploy to OSS
        run: ossutil cp -r web/dist/ oss://myvip/ -f