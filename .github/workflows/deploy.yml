name: Deploy to Aliyun OSS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: cd web && npm install
        
      - name: Build
        run: cd web && npm run build
        
      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64
          chmod 755 ossutil64
          sudo mv ossutil64 /usr/local/bin/ossutil
          
      - name: Configure ossutil
        run: |
          ossutil config -e oss-cn-hangzhou.aliyuncs.com -i ${{ secrets.ALIYUN_ACCESS_KEY_ID }} -k ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          
      - name: Deploy to OSS with correct headers
        run: |
          cd web/dist
          # 上传所有文件，设置正确的Content-Type
          ossutil cp -r . oss://myvip/ --force --include "*.html" --meta "Content-Type:text/html; charset=utf-8"
          ossutil cp -r . oss://myvip/ --force --include "*.js" --meta "Content-Type:application/javascript"
          ossutil cp -r . oss://myvip/ --force --include "*.css" --meta "Content-Type:text/css"
          ossutil cp -r . oss://myvip/ --force --exclude "*.html" --exclude "*.js" --exclude "*.css"