name: Deploy to Aliyun (Full Stack)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
          
      - name: Install dependencies
        run: |
          cd web
          npm install
          
      - name: Build
        run: |
          cd web
          npm run build
        env:
          VITE_BASE_TOKEN: ${{ secrets.VITE_BASE_TOKEN }}
          VITE_FEISHU_APP_ID: ${{ secrets.VITE_FEISHU_APP_ID }}
          VITE_FEISHU_APP_SECRET: ${{ secrets.VITE_FEISHU_APP_SECRET }}
          VITE_FEISHU_CHAT_ID: ${{ secrets.VITE_FEISHU_CHAT_ID }}
          VITE_GLM_API_KEY: ${{ secrets.VITE_GLM_API_KEY }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_ALIYUN_FC_URL: ${{ secrets.VITE_ALIYUN_FC_URL }}
          
      - name: Install ossutil
        run: |
          curl -L -o ossutil64 "https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64"
          chmod +x ossutil64
          sudo mv ossutil64 /usr/local/bin/ossutil
          
      - name: Configure ossutil
        run: |
          ossutil config -e oss-cn-hangzhou.aliyuncs.com -i ${{ secrets.ALIYUN_ACCESS_KEY_ID }} -k ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }} -L CH
          
      - name: Deploy to OSS
        run: |
          cd web/dist
          # 先上传所有文件（递归上传，自动设置Content-Type）
          ossutil cp -r . oss://myvip/ --update --jobs 10
          # 单独确保index.html的Content-Type正确（防止浏览器下载）
          ossutil set-meta oss://myvip/index.html "Content-Type:text/html; charset=utf-8" --update

  deploy-function:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Aliyun CLI
        run: |
          curl -L -o aliyun-cli.tgz "https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz"
          tar -xzf aliyun-cli.tgz
          chmod +x aliyun
          sudo mv aliyun /usr/local/bin/
          
      - name: Configure Aliyun CLI
        run: |
          aliyun configure set \
            --access-key-id ${{ secrets.ALIYUN_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }} \
            --region cn-hangzhou \
            --mode AK
          
      - name: Prepare function code
        run: |
          cd aliyun-fc
          zip -r function-code.zip index.js package.json
          
      - name: Upload code to OSS
        run: |
          curl -L -o ossutil64 "https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64"
          chmod +x ossutil64
          sudo mv ossutil64 /usr/local/bin/ossutil
          ossutil config -e oss-cn-hangzhou.aliyuncs.com -i ${{ secrets.ALIYUN_ACCESS_KEY_ID }} -k ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }} -L CH
          ossutil cp aliyun-fc/function-code.zip oss://myvip/function-code.zip --force
          
      - name: Update function code
        run: |
          aliyun fc-open PUT /2021-04-06/services/my-vip-service/functions/my-vip \
            --body "{\"code\":{\"ossBucketName\":\"myvip\",\"ossObjectName\":\"function-code.zip\"}}"
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          
  notify-success:
    needs: [deploy-frontend, deploy-function]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Success notification
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "Frontend: https://myvip.oss-cn-hangzhou.aliyuncs.com"
          echo "API: https://studentowth-api-jlpwzjexhc.cn-hangzhou.fcapp.run"
